# WirePlumber config for roc system tests: only stream/node linking.
#
# Every device monitor is disabled, so this instance can never enumerate or
# claim audio hardware, regardless of what runs on the host. D-Bus-dependent
# features (device reservation, portal, logind) are off as well.

wireplumber.profiles = {
  main = {
    monitor.alsa                    = disabled
    monitor.alsa-midi               = disabled
    monitor.bluez                   = disabled
    monitor.bluez-midi              = disabled
    monitor.libcamera               = disabled
    monitor.v4l2                    = disabled
    support.reserve-device          = disabled
    support.portal-permissionstore  = disabled
    support.logind                  = disabled
  }
}
