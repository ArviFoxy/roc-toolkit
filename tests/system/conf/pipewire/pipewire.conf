# PipeWire daemon config for roc system tests.
#
# Hardware-blind on purpose: no device monitors are involved anywhere in the
# test instance (see also the wireplumber config), so the instance cannot
# claim or even see sound cards. Clocking comes from the built-in dummy
# driver. D-Bus support is off; RT scheduling is not needed for tests.

context.properties = {
    core.daemon               = true
    core.name                 = pipewire-0
    default.clock.rate        = 48000
    default.clock.quantum     = 512
    default.clock.min-quantum = 32
    default.clock.max-quantum = 2048
    support.dbus              = false
    # Asserted by the test harness after startup, so a test can prove it is
    # talking to the isolated instance and not to a session daemon.
    test.marker               = roc-system-tests
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native
      args = {
          sockets = [
              { name = "pipewire-0" }
              { name = "pipewire-0-manager" }
          ]
      }
    }
    { name = libpipewire-module-access }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-link-factory }
]
