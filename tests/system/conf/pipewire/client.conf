# Client config for tools running inside the test environment (pw-dump,
# pw-cli, ...). PIPEWIRE_CONFIG_DIR replaces the whole config search path,
# so clients need their config here too.

context.properties = {
    support.dbus = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
